<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Criador de avatares Bonde Pro Max</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #70148c;
    }

    #back {
      position: absolute;
      z-index: 2;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      min-height: 48px;
      padding: 10px 20px;
      padding-top: max(10px, env(safe-area-inset-top, 0px));
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
      background: #70148c;
      color: #c4b5fd;
      font-family: Arial, sans-serif;
      font-size: 16px;
      text-decoration: none;
    }

    #unity-container,
    #unity-canvas {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      top: 48px;
      width: 100%;
      height: auto;
      display: block;
    }

    #unity-container {
      top: max(48px, calc(38px + env(safe-area-inset-top, 0px)));
    }

    #unity-canvas {
      inset: 0;
      width: 100%;
      height: 100%;
      background: #f2efe7;
      outline: none;
    }

    #loading {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 1;
      transform: translate(-50%, -50%);
      font-family: Arial, sans-serif;
      font-size: 16px;
      color: #4a4a4a;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <a id="back" href="/bonde-pro-max#criar-avatar">← Voltar</a>
  <div id="unity-container">
    <canvas id="unity-canvas" width="390" height="844" tabindex="-1"></canvas>
  </div>
  <div id="loading">Carregando...</div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#loading");
    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/MaxAvatar2026.loader.js";
    var config = {
      dataUrl: buildUrl + "/MaxAvatar2026.data.br",
      frameworkUrl: buildUrl + "/MaxAvatar2026.framework.js.br",
      codeUrl: buildUrl + "/MaxAvatar2026.wasm.br",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Bonde Pro Max",
      productName: "MaxAvatar2026",
      productVersion: "7.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: isIOS ? 1 : Math.min(window.devicePixelRatio || 1, 2),
      webglContextAttributes: {
        preserveDrawingBuffer: false,
        powerPreference: "default",
        antialias: false
      }
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        if (loading)
          loading.textContent = "Carregando... " + Math.round(progress * 100) + "%";
      }).then(function (unityInstance) {
        if (loading)
          loading.style.display = "none";
        window.unityInstance = unityInstance;
      }).catch(function (message) {
        if (loading)
          loading.textContent = "Não foi possível carregar o gerador neste aparelho.";
        console.error(message);
      });
    };
    script.onerror = function () {
      if (loading)
        loading.textContent = "Não foi possível carregar o gerador de avatar.";
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
