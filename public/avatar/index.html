<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Criador de avatares Bonde Pro Max</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f2efe7;
      overscroll-behavior: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    #unity-container {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }

    #unity-canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      background: #f2efe7;
      outline: none;
    }

    #loading {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: Arial, sans-serif;
      font-size: 16px;
      color: #4a4a4a;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
  </div>
  <div id="loading">Carregando...</div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#loading");
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/MaxAvatar2026.loader.js";
    var config = {
      dataUrl: buildUrl + "/MaxAvatar2026.data.br",
      frameworkUrl: buildUrl + "/MaxAvatar2026.framework.js.br",
      codeUrl: buildUrl + "/MaxAvatar2026.wasm.br",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Bonde Pro Max",
      productName: "MaxAvatar2026",
      productVersion: "7.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    function resizeCanvasCSS() {
      var width = document.documentElement.clientWidth || window.innerWidth;
      var height = document.documentElement.clientHeight || window.innerHeight;
      canvas.style.width = width + "px";
      canvas.style.height = height + "px";
    }
    window.addEventListener("resize", resizeCanvasCSS);
    window.addEventListener("orientationchange", function () {
      setTimeout(resizeCanvasCSS, 150);
    });
    resizeCanvasCSS();

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        if (loading)
          loading.textContent = "Carregando... " + Math.round(progress * 100) + "%";
      }).then(function (unityInstance) {
        if (loading)
          loading.style.display = "none";
        window.unityInstance = unityInstance;
        resizeCanvasCSS();
        window.setTimeout(resizeCanvasCSS, 120);
      }).catch(function (message) {
        if (loading)
          loading.textContent = message;
        console.error(message);
      });
    };
    script.onerror = function () {
      if (loading)
        loading.textContent = "Não foi possível carregar o gerador de avatar.";
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
