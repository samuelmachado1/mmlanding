<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Criador de avatares Bonde Pro Max</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f2efe7;
    }

    #unity-container,
    #unity-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #unity-canvas {
      background: #f2efe7;
      outline: none;
    }

    #loading {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-family: Arial, sans-serif;
      font-size: 16px;
      color: #4a4a4a;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>
  </div>
  <div id="loading">Carregando...</div>

  <script>
    var canvas = document.querySelector("#unity-canvas");
    var loading = document.querySelector("#loading");
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/MaxAvatar2026.loader.js";
    var config = {
      dataUrl: buildUrl + "/MaxAvatar2026.data.br",
      frameworkUrl: buildUrl + "/MaxAvatar2026.framework.js.br",
      codeUrl: buildUrl + "/MaxAvatar2026.wasm.br",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Bonde Pro Max",
      productName: "MaxAvatar2026",
      productVersion: "7.0",
      matchWebGLToCanvasSize: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    };

    function fillCanvas() {
      if (canvas.style.getPropertyValue("width") === "100%" && canvas.style.getPropertyValue("height") === "100%") {
        return;
      }
      canvas.style.setProperty("position", "absolute", "important");
      canvas.style.setProperty("left", "0", "important");
      canvas.style.setProperty("top", "0", "important");
      canvas.style.setProperty("width", "100%", "important");
      canvas.style.setProperty("height", "100%", "important");
      canvas.style.setProperty("margin", "0", "important");
    }

    fillCanvas();
    window.addEventListener("resize", fillCanvas);
    window.addEventListener("orientationchange", function () {
      window.setTimeout(fillCanvas, 150);
    });
    new MutationObserver(fillCanvas).observe(canvas, {
      attributes: true,
      attributeFilter: ["style"]
    });

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        if (loading)
          loading.textContent = "Carregando... " + Math.round(progress * 100) + "%";
      }).then(function (unityInstance) {
        if (loading)
          loading.style.display = "none";
        window.unityInstance = unityInstance;
        fillCanvas();
      }).catch(function (message) {
        if (loading)
          loading.textContent = message;
        console.error(message);
      });
    };
    script.onerror = function () {
      if (loading)
        loading.textContent = "Não foi possível carregar o gerador de avatar.";
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
